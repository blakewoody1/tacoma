<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tacoma">
<link rel="manifest" href="manifest.webmanifest">
<title>Tacoma</title>
<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#1d2320; --muted:#6c736f; --line:#e4e1da;
  --accent:#1f6f50; --accent-ink:#ffffff; --accent-soft:#e2efe8;
  --inc:#1f7a4d; --bill:#b4432f; --save:#2f5fa8; --spend:#9a6a12;
  --warn:#b4432f; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121513;--card:#1c201e;--ink:#eef1ef;--muted:#9aa39e;--line:#2b302d;
    --accent:#45b886;--accent-ink:#0d1a13;--accent-soft:#1e3329;
    --inc:#5fcf95;--bill:#ef8a74;--save:#86aef0;--spend:#e2b45a;--warn:#ef8a74;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 110px)}
.toprow{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.icon:active{background:var(--line)}
.months{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px;margin:0 -14px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.months::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:15px;white-space:nowrap;scroll-snap-align:center}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.hero{padding:18px 18px 14px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);padding:6px 10px;border-radius:10px;font-size:14px;font-weight:600}
.pill.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.statbtn{text-align:left;border:1.5px solid var(--accent);background:var(--accent-soft)}
.statbtn:active{transform:scale(.97)}
.safeval{color:var(--accent)}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat{padding:9px 7px!important;min-width:0}
.stat{display:flex;flex-direction:column;justify-content:space-between;gap:3px}
.stat small{display:block;color:var(--muted);font-size:11px;line-height:1.15}
.stat b{display:block;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.totals{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.totals b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--line);padding:3px;border-radius:12px;margin:16px 0 10px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-size:12.5px;letter-spacing:-.01em;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .bal{font-weight:600;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.group{overflow:hidden}
.past{opacity:.55}
.item{display:flex;width:100%;align-items:center;gap:12px;padding:12px 14px;text-align:left;border-top:1px solid var(--line);min-height:56px}
.item:first-child{border-top:0}
.item:active{background:var(--bg)}
.titem{padding:0;gap:0}
.titem:active{background:none}
.ibody{display:flex;flex:1;min-width:0;align-items:center;gap:12px;padding:12px 14px 12px 4px;text-align:left;min-height:56px}
.ibody:active{background:var(--bg)}
.chk{flex:none;width:44px;align-self:stretch;display:grid;place-items:center}
.chk::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;transition:all .15s}
.isClr .chk::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;line-height:18px;text-align:center}
.cbadge{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;margin-left:7px;vertical-align:2px}
.cstat{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px;color:var(--muted)}
.cstat b{color:var(--ink)}
.cstat.on{background:var(--accent-soft)}
.cstat.on b{color:var(--accent)}
.cstatbtn{flex:none;padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.cstat.on .cstatbtn{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.amt b.pos{color:var(--inc)}
.clrline{margin-top:10px;font-size:13px;color:var(--muted)}
.clrline b{color:var(--ink);font-variant-numeric:tabular-nums}
.clrsub{display:block;font-size:12px;margin-top:1px}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--bill)}
.k-income .dot{background:var(--inc)} .k-save .dot{background:var(--save)} .k-spend .dot{background:var(--spend)} .k-start .dot{background:var(--muted)}
.mid{flex:1;min-width:0}
.desc{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:right;font-variant-numeric:tabular-nums}
.amt b{display:block;font-weight:650}
.amt small{display:block;font-size:12px;color:var(--muted)}
.k-income .amt b{color:var(--inc)}
.neg{color:var(--warn)!important}
.today{display:flex;align-items:center;gap:8px;margin:14px 2px 2px;color:var(--accent);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.today::after{content:"";flex:1;height:2px;background:var(--accent);border-radius:2px;opacity:.5}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(env(safe-area-inset-bottom) + 22px);width:62px;height:62px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-size:34px;font-weight:300;box-shadow:0 8px 24px rgba(0,0,0,.22);display:grid;place-items:center;z-index:5}
.fab:active{transform:scale(.96)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick button{background:var(--bg);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.quick button i{font-style:normal;font-size:18px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;z-index:11;padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:19px;margin:0 0 12px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px;outline:none;-webkit-appearance:none;appearance:none;min-height:50px}
.field input:focus{border-color:var(--accent)}
.money-in{font-size:32px!important;font-weight:700;font-variant-numeric:tabular-nums;padding:10px 14px!important}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.typeseg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.typeseg button{padding:10px 0;border-radius:12px;background:var(--bg);font-weight:600;font-size:14px;border:2px solid transparent}
.typeseg button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.radio{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:6px;font-size:15px}
.radio input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:15px;border-radius:14px;font-weight:700;font-size:17px;background:var(--bg)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:#fff}
.btn:disabled{opacity:.5}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 96px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.notice{padding:18px;margin-top:12px}
.notice h3{margin:0 0 6px;font-size:17px}
.notice p{margin:0;color:var(--muted);font-size:15px}
.notice .btn{margin-top:14px}
.skel{height:14px;border-radius:7px;background:var(--line);margin:10px 0;animation:pulse 1.2s infinite ease-in-out}
@keyframes pulse{50%{opacity:.5}}
.empty{padding:22px;text-align:center;color:var(--muted)}
.seg-sm{display:flex;gap:6px;margin-top:6px}
.seg-sm button{flex:1;padding:10px;border-radius:12px;background:var(--bg);font-weight:600;font-size:14px;border:2px solid transparent}
.seg-sm button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
a{color:var(--accent)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{padding:12px 13px}
.ph b{display:block;font-size:14px}
.ph small{display:block;font-size:12px;color:var(--muted)}
.pnow{font-size:22px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pmeta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.pflow{display:flex;flex-direction:column;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pin{color:var(--inc)}
.safe{grid-column:1/-1;border:1.5px solid var(--accent);background:linear-gradient(var(--accent-soft),var(--card) 70%)}
.safe .pnow{font-size:30px;color:var(--accent)}
.safe .pnow.neg{color:var(--warn)}
.est{margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);line-height:1.4}
.qbox{padding:12px 14px;margin-bottom:12px;border:1.5px solid var(--spend);background:color-mix(in srgb,var(--spend) 8%,var(--card))}
.qhead{display:flex;justify-content:space-between;align-items:center}
.qsync{background:var(--accent);color:var(--accent-ink);padding:7px 12px;border-radius:10px;font-weight:700;font-size:14px}
.qitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;margin-top:6px}
.qitem small{display:block;font-size:12px}
.qx{color:var(--muted);padding:6px 8px;border-radius:8px;font-size:13px;flex:none}
.qx.armed{background:var(--warn);color:#fff}
.wide{grid-column:1/-1}
.unit{font-size:15px;font-weight:600;color:var(--muted)}
.lrow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.lrow small{color:var(--muted)}
.bar.thin{height:3px;margin:0 0 4px}
.wk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;text-align:center}
.wkb{position:relative;height:90px;background:var(--bg);border-radius:8px;overflow:hidden}
.wkb i{position:absolute;left:0;right:0;bottom:0;background:var(--spend);border-radius:6px 6px 0 0}
.wkb s{position:absolute;left:0;right:0;border-top:2px dashed var(--accent)}
.wkc b{display:block;font-size:13px;margin-top:4px;font-variant-numeric:tabular-nums}
.wkc small{font-size:11px;color:var(--muted)}
.tlwrap{position:relative}
.tl{height:min(74vh,700px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto;position:relative;border-radius:var(--r);padding:0 2px;
  mask-image:linear-gradient(transparent 0,#000 14px,#000 calc(100% - 18px),transparent);-webkit-mask-image:linear-gradient(transparent 0,#000 14px,#000 calc(100% - 18px),transparent)}
.tl .day{position:sticky;top:0;z-index:1;background:var(--bg)}
.day.isToday{color:var(--accent)}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:2}
h1{cursor:pointer}
kbd{display:none;font:600 11px -apple-system,sans-serif;color:var(--muted);margin-left:5px}
@media (min-width: 700px){ kbd{display:inline} }
.kbdhint{display:none}
@media (min-width: 700px){ .kbdhint{display:block} }
.kbbtn{margin-top:10px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:17px}
.kbbtn:active{transform:scale(.95)}
.kgroup{margin:14px 0}
.kh{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.krow{display:flex;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.keys{flex:none;min-width:118px;display:flex;gap:4px}
.kk{display:inline-block;font:600 13px -apple-system,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 7px;margin:0}
.tips{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted);line-height:1.45}
.tips li{margin:4px 0}
/* centered top card */
.hero{text-align:center}
.hero .big{margin:2px 0 10px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.hero .clrline{text-align:center}
.hero .stat{align-items:center;text-align:center}
.hero .statbtn{text-align:center}
.hero .totals{display:block;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tcap{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tgrid span{display:flex;flex-direction:column;align-items:center;gap:1px}
.tgrid small{font-size:11px;color:var(--muted)}
.tgrid b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
/* ---------- calculator (iPad / wide only) ---------- */
#calc{display:none;margin-top:14px}
.calc{padding:14px}
.cdisp{background:var(--bg);border-radius:12px;padding:10px 14px;text-align:right;margin-bottom:10px}
.cclip{display:flex;gap:6px;justify-content:flex-start;margin:-2px 0 4px}
.cclip button{font-size:12px;font-weight:700;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.cpaste{display:flex;gap:6px;margin:4px 0}
.cpaste[hidden]{display:none}
.cpaste input{flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1.5px solid var(--accent);background:var(--card);font-size:15px;outline:none}
.cpaste button{color:var(--muted);padding:0 8px}
.cexpr{font-size:14px;color:var(--muted);min-height:18px;word-break:break-all;font-variant-numeric:tabular-nums}
.cval{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ckeys button{padding:9px 0;border-radius:11px;background:var(--bg);font-size:19px;font-weight:600}
.ckeys button:active{transform:scale(.96);filter:brightness(.95)}
.ckeys .op{background:var(--accent-soft);color:var(--accent)}
.ckeys .eq{background:var(--accent);color:var(--accent-ink)}
.ckeys .fn{color:var(--muted);font-size:17px}
.ckeys .zero{grid-column:span 2}
.cact{display:flex;gap:7px;margin-top:9px}
.cact button{flex:1;padding:9px 6px;border-radius:10px;background:var(--bg);font-size:13px;font-weight:700;color:var(--accent)}
.tape{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.tapehead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tapehead button{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 6px}
.tapelist{max-height:260px;overflow-y:auto;margin-top:4px;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.tline{display:flex;justify-content:space-between;gap:10px;width:100%;padding:6px 4px;border-bottom:1px solid var(--line);font-size:14px;text-align:left}
.tline span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tline b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tline:active{background:var(--bg)}
.tempty{font-size:13px;color:var(--muted);padding:8px 0;font-family:-apple-system,sans-serif}
/* ---------- calm layout: title + month, one-line hero, 3 tabs ---------- */
.ttl{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.ttl h1{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.monbtn{display:inline-flex;align-items:center;gap:4px;font-size:26px;font-weight:700;letter-spacing:-.02em;padding:2px 0;min-height:44px}
.monbtn svg{color:var(--muted);margin-top:4px}
.icon svg{display:block}
.fab svg{display:block}
.hero{padding:0}
.herotap{display:flex;flex-direction:column;align-items:center;width:100%;padding:20px 18px 12px;text-align:center}
.herotap .lbl,.herotap .big,.herotap .status{display:block}
.herotap .big{margin:2px 0 6px}
.status{font-size:15px;color:var(--muted)}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.more{display:inline-flex;align-items:center;gap:3px;margin-top:10px;font-size:13px;font-weight:600;color:var(--muted)}
.more svg{transition:transform .2s}
.hero.open .more svg{transform:rotate(180deg)}
.details{padding:0 18px 16px;border-top:1px solid var(--line);padding-top:14px}
.details[hidden]{display:none}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;vertical-align:1px}
.badge[hidden]{display:none}
.seg button{font-size:14px}
.inseg{margin:0 0 12px}
.pastrow{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;padding:12px;margin:6px 0 2px;border-radius:12px;font-size:14px;font-weight:600;color:var(--muted);border:1px dashed var(--line)}
.pastrow:active{background:var(--card)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mchip{padding:14px 6px;border-radius:12px;background:var(--bg);border:1.5px solid transparent;font-weight:600;font-size:15px}
.mchip small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.mchip.on{border-color:var(--ink);background:var(--card)}
.upd{display:inline-flex;align-items:center;gap:6px;padding:10px 12px;color:var(--muted);font-size:12px}
.upd svg{opacity:.8}
.kbbtn{display:none}
@media (min-width:700px){ .kbbtn{display:inline-block} }
/* quieter color: neutral dots, green only for money coming in, red only for trouble */
.dot{width:8px;height:8px;background:color-mix(in srgb,var(--muted) 40%,transparent)}
.k-spend .dot,.k-save .dot,.k-start .dot{background:color-mix(in srgb,var(--muted) 40%,transparent)}
.k-income .dot{background:var(--inc)}
.shead{position:sticky;top:-10px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);
  margin:-4px -18px 8px;padding:8px 18px 10px;border-bottom:1px solid var(--line)}
.shead b{font-size:16px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{padding:8px 6px;font-size:17px;color:var(--muted);font-weight:500;min-width:64px;text-align:left}
.hbtn.primary{color:var(--accent);font-weight:800;text-align:right}
.radio small.hint{margin:0;font-size:12.5px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{text-align:left;padding:13px 14px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line)}
.choice b{display:block;font-size:16px}
.choice small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.choice:first-child{border-color:var(--accent);background:var(--accent-soft)}
.choice:active{transform:scale(.99)}
.repeatbtn{width:100%;margin:2px 0 4px;color:var(--accent);font-size:15px;padding:11px}
#liveDot{color:var(--accent);font-size:12px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}

/* ---------- iPad / wide screens ---------- */
@media (min-width: 900px){
  html,body{font-size:17px}
  .wrap{max-width:1320px;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 40px);
    display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);grid-template-rows:auto auto auto 1fr auto;column-gap:22px;align-items:start}
  .toprow,#queue,.foot{grid-column:1 / -1}
  .toprow{grid-row:1;padding-bottom:6px}
  #queue{grid-row:2}
  /* "Updated" line and the ⌘ button sit beside the + button */
  .foot{position:fixed;right:112px;bottom:calc(env(safe-area-inset-bottom) + 24px);z-index:6;margin:0;padding:0;
    display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}
  .foot > div{display:inline-flex}
  .foot .kbbtn{margin-top:0;width:28px;height:28px;font-size:15px;border-radius:8px}
  #view{padding-bottom:110px}
  #leftcol{grid-column:1;grid-row:3 / span 2;position:sticky;top:16px;align-self:start;max-height:calc(100vh - 24px);overflow-y:auto;scrollbar-width:none}
  #leftcol::-webkit-scrollbar{display:none}
  #calc{display:block}
  #periods{display:none}
  #tabs{grid-column:2;grid-row:3;margin-top:0}
  #view{grid-column:2;grid-row:4}
  h1{font-size:26px}
  .hero .big{font-size:46px}
  .stat b{font-size:15px}
  .stat small{font-size:12px}
  .seg button{font-size:15px;padding:11px 0}
  .tl{height:calc(100vh - 250px);min-height:420px}
  .item,.ibody{min-height:62px}
  .desc{font-size:17px}
  .sub{font-size:14px}
  .amt b{font-size:17px}
  .day{font-size:14px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .pmeta,.pflow,.ph small,.clrline,.totals,.hint,.est,.lrow{font-size:14px}
  .ph b{font-size:16px}
  .pnow{font-size:26px}
  .safe .pnow{font-size:34px}
  .fab{right:28px;bottom:calc(env(safe-area-inset-bottom) + 22px)}
  .toast{bottom:calc(env(safe-area-inset-bottom) + 110px)}
  .sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:22px;max-height:86vh;animation:none}
  .grab{display:none}
}
/* left column always fits the screen: card + keypad keep their size, the tape takes whatever height is left */
@media (min-width: 900px){
  #leftcol{display:flex;flex-direction:column;height:calc(100vh - 84px);height:calc(100dvh - 84px);max-height:none;overflow:hidden}
  #hero{flex:none}
  #calc{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:10px}
  #calc .calc{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px}
  #calc .cdisp{flex:none;padding:8px 12px;margin-bottom:8px}
  #calc .ckeys,#calc .cact{flex:none}
  #calc .ckeys{gap:6px}
  #calc .ckeys button{padding:7px 0;font-size:18px}
  #calc .cact{margin-top:7px}
  #calc .cact button{padding:7px 6px}
  #calc .cval{font-size:26px}
  #calc .tape{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:8px;padding-top:6px}
  #calc .tapelist{flex:1;min-height:44px;max-height:none}
  /* tighter balance card */
  .hero{padding:14px 16px 12px}
  .hero .big{font-size:40px;margin:0 0 8px}
  .hero .pill{padding:5px 9px;font-size:13px}
  .hero .stats{margin-top:10px}
  .hero .totals{margin-top:10px;padding-top:8px}
}
/* shorter screens (split view, Safari toolbars): squeeze a bit more */
@media (min-width: 900px) and (max-height: 900px){
  .hero .big{font-size:34px}
  .hero .lbl{font-size:13px}
  .hero .clrline{margin-top:6px}
  .stat{padding:7px 6px!important}
  #calc .ckeys button{padding:5px 0;font-size:17px}
  #calc .cval{font-size:22px}
  #calc .cclip{margin:0 0 2px}
  .hero{padding:10px 14px}
  .pills{flex-wrap:nowrap}
  .hero .pill{font-size:12px;padding:4px 8px;white-space:nowrap}
  .hero .clrline{font-size:12px}
  .hero .clrsub{display:inline;margin-left:6px;font-size:12px}
  .hero .stats{margin-top:8px;gap:5px}
  .stat small{font-size:10.5px}
  .stat b{font-size:13px}
  .tcap{display:none}
  .hero .totals{margin-top:8px;padding-top:6px}
  #calc{margin-top:8px}
  #calc .calc{padding:8px 10px}
  #calc .cdisp{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:10px;padding:6px 10px;margin-bottom:6px}
  #calc .cclip{grid-column:1;grid-row:1 / span 2;flex-direction:column;gap:4px;margin:0}
  #calc .cclip button{padding:3px 7px;font-size:11px}
  #calc .cexpr{grid-column:2;grid-row:1;font-size:12px;min-height:14px}
  #calc .cval{grid-column:2;grid-row:2;font-size:22px}
  #calc .cpaste{grid-column:1 / -1;grid-row:3}
  #calc .ckeys{gap:5px}
  #calc .ckeys button{padding:4px 0;font-size:16px;border-radius:9px}
  #calc .cact{margin-top:5px;gap:5px}
  #calc .cact button{padding:5px 4px;font-size:12px}
  #calc .tape{margin-top:6px;padding-top:4px}
  #calc .tline{padding:4px;font-size:13px}
}
@media (min-width: 900px) and (max-height: 720px){
  .hero .totals{display:none}
}
@media (min-width: 900px) and (max-width: 1180px){ .livefrom{display:none} }
@media (min-width: 1200px){
  .wrap{grid-template-columns:440px minmax(0,1fr)}
}
/* hero padding lives on its two halves now (keep this after the iPad rules) */
#hero .hero{padding:0!important}
@media (min-width: 900px){
  .herotap{padding:14px 16px 8px}
  .details{padding:10px 16px 12px}
  .seg button{font-size:15px}
}
@media (min-width: 900px) and (max-height: 900px){
  .herotap{padding:10px 14px 6px}
  .more{margin-top:6px}
  .details{padding:8px 14px 10px}
}

/* ---------- Tacoma additions (same system as Cash Flow) ---------- */
.k-over .dot{background:var(--warn)}
.k-soon .dot{background:var(--spend)}
.k-owner .dot{background:var(--accent)}
.k-shop .dot{background:color-mix(in srgb,var(--muted) 40%,transparent)}
.k-mile .dot{background:var(--ink)}
.k-over .amt small{color:var(--warn);font-weight:600}
.k-soon .amt small{color:var(--spend);font-weight:600}
.secthead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 6px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.secthead.warn{color:var(--warn)}
.secthead.soon{color:var(--spend)}
.secthead span{font-weight:600;text-transform:none;letter-spacing:0}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px 4px;padding:0 14px 6px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0 14px;margin:6px 0 4px}
.kv dt{color:var(--muted);font-size:13px;font-weight:600;padding:9px 0;border-top:1px solid var(--line)}
.kv dd{margin:0;font-size:15px;padding:9px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;word-break:break-word}
.kv dt:first-of-type,.kv dd:first-of-type{border-top:0}
.ntext{white-space:pre-wrap;font-size:15px;line-height:1.45;background:var(--bg);border-radius:12px;padding:12px 14px;margin:8px 0}
.minihist{margin-top:6px}
.minihist .lrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.specs{padding:12px 14px}
.specs .kh{margin-bottom:2px}
.specrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.specrow:first-of-type{border-top:0}
.specrow small{color:var(--muted)}
.specrow b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.qa button{background:var(--bg);border-radius:12px;padding:11px 6px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink)}
.qa button svg{color:var(--accent)}
.qa button:active{transform:scale(.97)}
.mile{padding:12px 14px;margin-bottom:10px}
.mile .mh{display:flex;justify-content:space-between;align-items:baseline}
.mile .mh b{font-size:17px;font-variant-numeric:tabular-nums}
.mile .mh small{color:var(--muted);font-size:13px}
.mile p{margin:6px 0 0;font-size:14px;line-height:1.4}
.mile p small{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.05em;margin-right:4px}
.svcchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.svcchips button{padding:8px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:14px}
.svcchips button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.svcchips button.due{border-style:dashed}
.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:inherit;font-size:16px;outline:none;min-height:80px;resize:vertical}
.field textarea:focus{border-color:var(--accent)}
.steps{list-style:none;margin:6px 0 0;padding:0;counter-reset:s}
.steps li{counter-increment:s}
.steps button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 2px;border-top:1px solid var(--line);font-size:16px;line-height:1.35}
.steps li:first-child button{border-top:0}
.steps button::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--bg);color:var(--muted);margin-top:-2px}
.steps button.done{color:var(--muted);text-decoration:line-through}
.steps button.done::before{content:"✓";background:var(--accent);color:var(--accent-ink)}
.prog{font-size:13px;color:var(--muted);font-weight:600}
.warnline{margin-top:10px;font-size:13px;color:var(--warn);font-weight:600}
#specs{display:none}
@media (min-width: 900px){
  #specs{display:block;margin-top:12px}
  #leftcol{display:block;height:auto;max-height:calc(100vh - 24px);overflow-y:auto}
  .details .specsInline{display:none}
}

/* ---------- v2: status board, mileage, guides, export ---------- */
.unit{font-size:20px;font-weight:600;color:var(--muted);letter-spacing:0}
.odorow{display:flex;gap:8px;width:100%;margin-top:12px}
.odorow input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px;font-variant-numeric:tabular-nums;outline:none;text-align:center}
.odorow input:focus{border-color:var(--accent)}
.odobtn{flex:none;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.odobtn:active{transform:scale(.97)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 16px 0}
.stats3 .stat{align-items:center;text-align:center;padding:10px 6px!important}
.stats3 .stat b{font-size:18px}
.statbtn.warnbtn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.morebtn{display:block;width:100%;text-align:center;padding:4px 0 12px}
.linkbtn{color:var(--accent);font-weight:700;font-size:13px;text-transform:none;letter-spacing:0}
.histbar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.histbar .filters{flex:1;min-width:0;margin:0;padding:0 0 6px 0}
.exportbtn{flex:none;display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{padding:5px 10px;border-radius:8px;background:var(--bg);font-size:13px;font-weight:600;color:var(--muted)}
.svcseg{margin-top:10px}
.svcseg button{font-size:13.5px;padding:9px 4px}
.tools{margin:4px 0 0;padding-left:20px;font-size:15px;line-height:1.5}
.tools li{padding:2px 0}
.exbox{width:100%;height:42vh;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:12.5px/1.45 ui-monospace,"SF Mono",Menlo,monospace;color:var(--ink);resize:vertical;white-space:pre;overflow:auto}
.linkbtn2{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:var(--ink);font-size:15px}
.shopin{margin-top:8px;width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:17px}
.chips button{color:var(--ink)}
@media (min-width: 900px){ .stats3 .stat b{font-size:20px} }

.amzlist{display:flex;flex-direction:column;margin-top:2px}
.amz{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.amz:first-child{border-top:0}
.amz:active{background:var(--bg)}
.amzt{flex:1;min-width:0}
.amzt b{display:block;font-size:15px;font-weight:600}
.amzt small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.amzgo{flex:none;font-size:12px;font-weight:700;color:#e0362b;padding:5px 9px;border-radius:8px;background:color-mix(in srgb,#e0362b 12%,transparent)}
.amz.off .amzgo{display:none}

/* ---------- service map ---------- */
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:2px 4px 10px}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.mapcard{padding:0;overflow:hidden}
.mapscroll{--lab:150px;--cw:34px;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
.mbody{position:relative}
.mrow{display:grid;grid-template-columns:var(--lab) repeat(var(--cols),var(--cw));align-items:center;width:max-content;min-height:44px;border-top:1px solid var(--line);text-align:left}
.mrow:active .mlab{background:var(--bg)}
.mhead{min-height:34px;border-top:0;background:var(--bg)}
.mlab{position:sticky;left:0;z-index:2;background:var(--card);padding:6px 10px 6px 12px;height:100%;display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);min-width:0}
.mhead .mlab{background:var(--bg)}
.mlab b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlab small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.mc{display:grid;place-items:center;height:100%}
.mh{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mh em{font-style:normal;opacity:.5}
.mh.now{color:#e0362b}
.md{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--muted);opacity:.35}
.md.ring{background:transparent;border:2.5px solid var(--muted);box-sizing:border-box}
.md.done{background:var(--accent);opacity:1}
.md.ring.done{background:transparent;border-color:var(--accent)}
.md.miss{background:#e0362b;opacity:.85}
.md.ring.miss{background:transparent;border-color:#e0362b}
.md.next{background:var(--ink);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 25%,transparent)}
.md.ring.next{background:transparent;border-color:var(--ink)}
.md.next.late{background:#e0362b;box-shadow:0 0 0 3px color-mix(in srgb,#e0362b 30%,transparent)}
.md.ring.next.late{background:transparent;border-color:#e0362b}
.mline{position:absolute;top:0;bottom:0;width:2px;background:#e0362b;z-index:1;pointer-events:none;opacity:.85}
@media (min-width:900px){ .mapscroll{--lab:200px;--cw:40px} .mlab b{font-size:14px} }
#tabs button{font-size:13.5px}

.vids{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.vid{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);text-decoration:none;color:var(--ink)}
.vid:active{transform:scale(.99)}
.play{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#e0362b;color:#fff}
.vt{flex:1;min-width:0}
.vt b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.vt small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.todtag{display:inline-block;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,#e0362b 14%,transparent);color:#e0362b;font-weight:700}
.libcard{margin-top:12px;background:var(--card)}

function amzQuery(name, detail){
  const t = `${name} ${detail || ""}`;
  if (AMZ_SKIP.test(name)) return null;
  const pn = t.match(/\b\d{5}-[A-Z0-9]{5}\b/);
  if (pn) return `Toyota ${pn[0]}`;
  for (const [re, q] of AMZ_MAP) { const m = t.match(re); if (m) return q.replace("$1", m[1] || ""); }
  return name.replace(/\(.*?\)/g, "").replace(/\s+—.*$/, "").trim() + " Toyota Tacoma";
}
const amzURL = q => "https://www.amazon.com/s?k=" + encodeURIComponent(q);
function amzLink(inner, name, detail){
  const q = amzQuery(name, detail);
  return q ? `<a class="amz" href="${esc(amzURL(q))}" target="_blank" rel="noopener">${inner}<span class="amzgo">Amazon ›</span></a>` : `<div class="amz off">${inner}</div>`;
}

/* ---------- dates & numbers ---------- */
const EPOCH = Date.UTC(1899,11,30);
const parts = s => { const d = new Date(EPOCH + Math.round(s)*864e5); return {y:d.getUTCFullYear(), m:d.getUTCMonth(), d:d.getUTCDate(), w:d.getUTCDay()}; };
const toSerial = (y,m,d) => Math.round((Date.UTC(y,m,d) - EPOCH)/864e5);
const todaySerial = () => { const n = new Date(); return toSerial(n.getFullYear(), n.getMonth(), n.getDate()); };
const isoToSerial = iso => { const [y,m,d] = iso.split("-").map(Number); return toSerial(y,m-1,d); };
const serialToIso = s => { const p = parts(s); return `${p.y}-${String(p.m+1).padStart(2,"0")}-${String(p.d).padStart(2,"0")}`; };
const serialToUS = s => { const p = parts(s); return `${p.m+1}/${p.d}/${p.y}`; };
function parseDate(t){
  t = String(t ?? "").trim(); if (!t) return null;
  if (/^\d+(\.\d+)?$/.test(t) && +t > 20000) return Math.round(+t);
  let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return {s: toSerial(y, +m[1]-1, +m[2]), approx:false}; }
  m = t.match(/^(\d{1,2})\/(\d{4})$/);
  if (m) return {s: toSerial(+m[2], +m[1]-1, 1), approx:true};
  const d = new Date(t); return isNaN(d) ? null : {s: toSerial(d.getFullYear(), d.getMonth(), d.getDate()), approx:false};
}
const parseNum = t => { if (typeof t === "number") return t; const n = parseFloat(String(t ?? "").replace(/[^\d.]/g, "")); return isNaN(n) ? null : n; };
const mi = n => Math.round(n).toLocaleString("en-US");
const short = s => { const p = parts(s); return `${MON[p.m]} ${p.d}`; };
const shortY = s => { const p = parts(s), y = parts(todaySerial()).y; return `${MON[p.m]} ${p.d}${p.y !== y ? ", " + p.y : ""}`; };
const longDate = s => { const p = parts(s); return `${DOW[p.w]}, ${MON[p.m]} ${p.d}, ${p.y}`; };
const qt = t => `'${t.replace(/'/g,"''")}'`;
const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");

/* ---------- connector ---------- */
// Talks to the Apps Script attached to your Tacoma Maintenance sheet (link + key are saved in Settings on each device)
const CFG = { url: lsGet("tm_api") || "", key: lsGet("tm_key") || "" };
const READS = new Set(["get_spreadsheet", "get_values"]);
async function call(tool, input){
  if (!CFG.url || !CFG.key) throw {code:"not_setup", message:"Add your Apps Script link and key in Settings."};
  if (!navigator.onLine) throw {code:"server_unavailable", message:"No signal."};
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), READS.has(tool) ? 25000 : 60000);
  let res;
  try {
    res = await fetch(CFG.url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({key: CFG.key, tool, input}), signal: ctl.signal, redirect:"follow"});
  } catch(e) { throw {code:"server_unavailable", message: navigator.onLine ? "Couldn't reach your Apps Script." : "No signal."}; }
  finally { clearTimeout(tm); }
  let j = null; try { j = await res.json(); } catch(e) {}
  if (!j) throw {code:"bad_response", message:"The Apps Script link didn't answer as expected."};
  if (j.error) throw {code: j.code || "tool_error", message: j.error};
  return j.result;
}
const upd = (range, values) => call("update_values", {spreadsheetId:S.id, range, values});
const getv = range => call("get_values", {spreadsheetId:S.id, range}).then(p => (p && p.values) || []);

    bad_response: ["Apps Script link isn't right","Check Settings: it should be the Web app URL ending in /exec, deployed with access set to Anyone."],
    server_not_connected: ["Google Sheets isn't connected","Add the Google Sheets connector in claude.ai Settings → Connectors, then tap Try again."],

  };
  return map[code] || ["Something went wrong", (e && e.message) || String(e)];
}

/* ---------- loading ---------- */
async function loadHistory(){
  const v = await getv(`${qt(HIST)}!A1:I1000`);
  if (!v.length || norm(v[0][0]) !== "date") throw {code:"layout", message:"The History tab should start with a Date / Odometer / Service performed header."};
  const rows = []; let lastRow = 1;
  v.forEach((row, i) => {
    if (i === 0) return;
    const r = i + 1;
    if (row.slice(0,5).some(x => String(x ?? "").trim() !== "")) lastRow = r;
    const svc = String(row[2] ?? "").trim(); if (!svc) return;
    const d = parseDate(row[0]); const odoT = String(row[1] ?? "").trim();
    rows.push({ r, dateText: String(row[0] ?? ""), serial: d ? d.s : null, dApprox: d ? d.approx : true,
      odoText: odoT, odo: parseNum(odoT), oApprox: /~|about|approx/i.test(odoT) || !odoT,
      svc, notes: String(row[3] ?? "").trim(), src: String(row[4] ?? "").trim(),
      milestone: /purchased/i.test(svc) });
  });
  const c9 = v[8] || [], c10 = v[9] || [];
  const so = parseNum(c9[8]), sd = parseDate(c10[8]);
  const sheetOdo = so && /odometer/i.test(c9[7] || "") ? {odo: so, serial: sd ? sd.s : null} : null;
  return {rows, lastRow, sheetOdo};
}
async function loadSchedule(){
  const v = await getv(`${qt(SCHED)}!A1:H60`);
  const h = v.findIndex(r => norm(r[0]) === "service" && /type/i.test(r[1] || ""));
  if (h < 0) throw {code:"layout", message:"Couldn't find the Service / Type header on the schedule tab."};
  const out = [];
  for (let i = h + 1; i < v.length; i++){
    const r = v[i]; if (!r || !String(r[0] ?? "").trim()) break;
    out.push({ name: String(r[0]).trim(), type: String(r[1] ?? "").trim() || "Routine", first: parseNum(r[2]), every: parseNum(r[3]),
      spec: String(r[4] ?? "").trim(), part: String(r[5] ?? "").trim(), torque: String(r[6] ?? "").trim(), notes: String(r[7] ?? "").trim() });
  }
  const tip = v.slice(h).map(r => r && r[0]).find(t => /fluids degrade/i.test(t || ""));
  return {list: out.filter(s => s.every), tip: tip || ""};
}
async function loadExtras(){
  const [ins, gar, meta] = await Promise.all([getv(`${qt(INSTR)}!A1:B80`).catch(() => []), getv(`${qt(GARAGE)}!A1:B10`).catch(() => []),
    call("get_spreadsheet", {spreadsheetId:S.id, fields:["sheets.properties.sheetId","sheets.properties.title"]}).catch(() => null)]);
  const hs = meta && (meta.sheets || []).map(x => x.properties).find(p => p && p.title === HIST);
  const steps = []; let on = false, fuel = "";
  for (const r of ins){
    const a = String((r && r[0]) ?? "").trim();
    if (/^oil change steps/i.test(a)) { on = true; continue; }
    if (on) { if (/^\d+$/.test(a) && r[1]) { steps.push(String(r[1]).trim()); continue; } if (steps.length) on = false; }
    if (/fuel system cleaner/i.test(a)) fuel = String(r[1] ?? "").trim();
  }
  const url = gar.flat().find(x => /^https?:\/\//.test(String(x || ""))) || "";
  return {steps, fuel, garage: url, histGid: hs ? hs.sheetId : null};
}

/* ---------- odometer & driving pace ---------- */
function reading(){
  const logged = S.hist.filter(r => r.odo != null && !r.oApprox && r.serial != null).sort((a,b) => a.odo - b.odo);
  const last = logged[logged.length - 1];
  let k = last ? {odo:last.odo, serial:last.serial, from:"log"} : null;
  const so = S.sheetOdo;
  if (so && so.odo && (!k || so.odo >= k.odo)) k = {odo:so.odo, serial:so.serial ?? todaySerial(), from:"sheet"};
  const man = lsJSON("tm_odo", null);   // entered here, maybe not synced yet
  if (man && man.odo && (!k || man.odo > k.odo)) k = {odo:man.odo, serial:man.serial, from:"manual"};
  return k;
}
function pace(){
  // miles per day over (roughly) the last year of readings
  const k = reading(); if (!k) return null;
  const pts = S.hist.filter(r => r.odo != null && !r.oApprox && r.serial != null && !r.dApprox).map(r => ({o:r.odo, s:r.serial}));
  if (k.from !== "log") pts.push({o:k.odo, s:k.serial});
  pts.sort((a,b) => a.s - b.s);
  const end = pts[pts.length - 1]; if (!end) return null;
  const start = pts.find(p => p.s >= end.s - 365) || pts[0];
  const days = end.s - start.s; if (days < 30 || end.o <= start.o) return null;
  return {perDay: (end.o - start.o) / days, since: start.s};
}
function estNow(){
  const k = reading(), p = pace(); if (!k) return null;
  const T = todaySerial();
  return p ? Math.round(k.odo + p.perDay * Math.max(0, T - k.serial)) : k.odo;
}
function whenAt(odo){
  const k = reading(), p = pace(); if (!k || !p) return null;
  const s = Math.round(k.serial + (odo - k.odo) / p.perDay);
  return s;
}

/* ---------- what's due ---------- */
const MATCH = {
  "engine oil and filter": [/oil change|oil and filter|oil & filter/i, "svc"],
  "tire rotation": [/rotat/i, "svc"],
  "intake (engine air) filter": [/engine air filter|intake filter|intake \(engine air\)/i, "both"],
  "front brakes": [/front (disc )?brake|brake pads|pads\/discs|pads and (rotors|discs)/i, "both"],
  "grease driveshaft": [/(grease|lubricat)\w*[^,.;]*(prop(eller)?|drive)\s*shaft|(prop(eller)?|drive)\s*shaft[^,.;]*(greas|lubricat)/i, "svc"],
  "cabin filter": [/cabin (air )?filter/i, "svc"],
  "drum brakes": [/drum|brake shoes|rear brakes/i, "both"],
  "brake fluid": [/brake fluid/i, "both"],
  "rear diff fluid": [/rear diff/i, "svc"],
  "front diff fluid": [/front diff/i, "svc"],
  "transmission drain and fill (1x)": [/transmission (fluid|drain|fill|service)|\bATF\b/i, "svc"],
  "transmission strainer": [/strainer|transmission filter/i, "svc"],
  "pcv valve": [/\bpcv\b/i, "svc"],
  "power steering fluid": [/power steering/i, "svc"],
  "transfer case oil": [/transfer case/i, "svc"],
  "spark plugs": [/spark plug/i, "svc"],
  "maf and throttle body cleaning": [/\bmaf\b|throttle body/i, "svc"],
  "serpentine belt": [/serpentine|drive belt/i, "svc"],
  "coolant": [/coolant/i, "svc"],
};
function matcher(s){
  const m = MATCH[norm(s.name)];
  if (m) return m;
  const w = s.name.split(/[\s(]/)[0].replace(/[^\w]/g, "");
  return [new RegExp(w, "i"), s.type === "Inspect" ? "both" : "svc"];
}
// Notes that only describe what Toyota's schedule calls for (not what was done) don't count
const doneNotes = n => String(n || "").replace(/Toyota \d+K schedule:[^\n]*/gi, "");
function doneRows(s){
  const [re, where] = matcher(s);
  return S.hist.filter(r => !r.milestone && (re.test(r.svc) || (where === "both" && re.test(doneNotes(r.notes)))));
}
function dueList(){
  const k = reading(); if (!k) return [];
  const now = k.odo, est = estNow() ?? now;
  return S.sched.map(s => {
    const rows = doneRows(s).filter(r => r.odo != null).sort((a,b) => b.odo - a.odo || (b.serial||0) - (a.serial||0));
    const last = rows[0] || null;
    const at = last ? last.odo + s.every : (s.first || s.every);
    const left = at - now;
    const soonBand = Math.min(1000, s.every * 0.2);
    const status = left < 0 ? "over" : (left <= soonBand || at - est <= 0) ? "soon" : "ok";
    return {s, last, rows, at, left, status, when: whenAt(at)};
  }).sort((a,b) => a.left - b.left);
}
function oilInfo(){ return dueList().find(d => /oil and filter|oil change/i.test(d.s.name)) || null; }
function milestones(n){
  const k = reading(); if (!k || !S.sched.length) return [];
  const out = []; let m = Math.floor(k.odo / 5000) * 5000 + 5000;
  for (let guard = 0; out.length < n && guard < 200; guard++, m += 5000){
    const due = S.sched.filter(s => { const f = s.first || s.every; return m >= f && (m - f) % s.every === 0; });
    if (due.length) out.push({m, routine: due.filter(s => s.type !== "Inspect"), inspect: due.filter(s => s.type === "Inspect")});
  }
  return out;
}

/* ---------- offline queue ---------- */
S.queue = lsJSON("tm_queue", []);
function saveQueue(){ lsSet("tm_queue", JSON.stringify(S.queue)); renderQueue(); }
const NETWORKISH = new Set(["server_unavailable","upstream_error","rate_limited"]);
function rowValues(op){ return [[op.date ? serialToUS(op.date) : (op.dateText || ""), op.odo ?? "", op.svc, op.notes || "", op.src || ""]]; }
async function execOp(op){
  if (op.type === "odo") {
    await upd(`${qt(HIST)}!H9:I10`, [["Current odometer (app)", op.odo], ["Odometer updated (app)", serialToUS(op.date)]]);
    const man = lsJSON("tm_odo", null); if (man && man.odo === op.odo) { try { localStorage.removeItem("tm_odo"); } catch(_){} }
    return;
  }
  if (op.type === "log") return call("add_log", {spreadsheetId:S.id, opId: op.opId || op.qid || newOpId(), row: rowValues(op)[0]});
  const fresh = await loadHistory();
  let row = fresh.rows.find(x => x.r === op.r && norm(x.svc) === norm(op.origSvc));
  if (!row) row = fresh.rows.find(x => norm(x.svc) === norm(op.origSvc) && x.serial === op.origDate);
  if (!row) {
    if (op.type === "delete") return;                       // already gone
    throw {code:"layout", message:`Couldn't find “${op.origSvc}” on History anymore.`};
  }
  if (op.type === "edit") return upd(`${qt(HIST)}!A${row.r}:E${row.r}`, rowValues(op));
  if (op.type === "delete") return upd(`${qt(HIST)}!A${row.r}:E${row.r}`, [["","","","",""]]);
}
const newOpId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
function enqueue(op, maybeSent){ S.queue.push({...op, qid: Date.now() + "-" + Math.random().toString(36).slice(2,7), maybeSent: !!maybeSent}); saveQueue(); }
async function submitOp(op, label, done){
  if (S.busy && !flushing) return;
  if (!navigator.onLine || S.queue.length || flushing) {
    enqueue(op, false); closeSheet();
    toast(navigator.onLine ? "Saved — sending after the earlier changes" : "No signal — saved on this phone, will sync", 3500);
    if (navigator.onLine) flushQueue();
    return;
  }
  if (op.type === "log" && !op.opId) op.opId = newOpId();
  S.busy = true; toast(label + "…", 0);
  try { await execOp(op); closeSheet(); await loadAll(); toast(done || "Saved"); }
  catch(e){
    if (!navigator.onLine || NETWORKISH.has(e && e.code)) { enqueue(op, true); closeSheet(); toast("Couldn't reach Google Sheets — saved on this phone, will retry", 4000); }
    else { const [h, b] = errInfo(e); toast(`${h}. ${b || ""}`, 6000); try { await loadAll(); } catch(_){} }
  }
  finally { S.busy = false; renderQueue(); }
}
let flushing = false;
async function flushQueue(manual){
  if (flushing || S.busy || !S.queue.length || !mcp) return;
  if (!navigator.onLine) { if (manual) toast("Still offline"); return; }
  flushing = true; S.busy = true; let sent = 0, stuck = null; renderQueue();
  while (S.queue.length){
    const op = S.queue[0];
    try { await execOp(op); S.queue.shift(); sent++; saveQueue(); }
    catch(e){
      if (!navigator.onLine || NETWORKISH.has(e && e.code)) { op.maybeSent = true; saveQueue(); break; }
      stuck = {op, e}; break;
    }
  }
  flushing = false; S.busy = false;
  if (stuck) { stuck.op.error = errInfo(stuck.e).join(": "); saveQueue(); }
  if (sent) { await loadAll(); toast(`Synced ${sent} change${sent > 1 ? "s" : ""}`); }
  else if (manual && !stuck) toast("Couldn't reach Google Sheets yet");
  renderQueue();
}
function opLabel(op){
  if (op.type === "log") return `Log · ${op.svc} · ${op.odo != null ? mi(op.odo) + " mi · " : ""}${op.date ? short(op.date) : ""}`;

  }
  if (tab === "log") {
    body = `${rows.length ? `<p class="hint" style="margin-top:12px">Tap an entry to edit it.</p><div class="card group" style="box-shadow:none">${rows.map(histItem).join("")}</div>` : `<div class="empty">Nothing in History matches this yet.</div>`}`;
  }
  openSheet(`<div class="shead"><button type="button" class="hbtn" data-close>Close</button><b>${esc(s.name)}</b><button type="button" class="hbtn primary" data-logsvc="${esc(s.name)}">Log</button></div>
    ${status ? `<div class="cstat ${d.left >= 0 ? "on" : ""}" style="margin-top:4px"><span>${status}</span></div>` : ""}
    <div class="seg-sm svcseg">${segs.map(([k, l]) => `<button type="button" data-svctab="${k}" class="${k === tab ? "on" : ""}">${l}</button>`).join("")}</div>
    ${body}
    <div class="btns"><button type="button" class="btn" data-close>Close</button><button type="button" class="btn primary" data-logsvc="${esc(s.name)}">Log new entry</button></div>`);
}
function histSheet(r){
  const row = S.hist.find(x => x.r === r); if (!row) return;
  const kv = [["Date", row.serial != null && !row.dApprox ? longDate(row.serial) : row.dateText], ["Odometer", row.odoText ? (row.odo != null && !row.oApprox ? mi(row.odo) + " mi" : row.odoText) : "—"], ["Source", row.src || "—"], ["Sheet row", String(row.r)]];
  const related = S.sched.filter(s => doneRows(s).includes(row));
  openSheet(`<div class="shead"><button type="button" class="hbtn" data-close>Close</button><b>Service</b><button type="button" class="hbtn primary" data-edit="${row.r}">Edit</button></div>
    <h2 style="margin:4px 0 6px">${esc(row.svc)}</h2>
    <dl class="kv">${kv.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl>
    ${row.notes ? `<div class="kh" style="margin-top:12px">Notes</div><div class="ntext">${esc(row.notes)}</div>` : ""}
    ${related.length ? `<div class="kh" style="margin-top:12px">Counts toward</div><div class="chips">${related.map(s => `<button type="button" data-svc="${esc(s.name)}">${esc(s.name)}</button>`).join("")}</div>` : ""}
    <div class="btns"><button type="button" class="btn danger" id="btnDel" data-del="${row.r}">Remove</button><button type="button" class="btn primary" data-edit="${row.r}">Edit</button></div>`);
}
const svcLabel = n => /^engine oil and filter$/i.test(n) ? "Oil change" : n;
function logSheet(opts = {}){
  const row = opts.edit ? S.hist.find(x => x.r === opts.edit) : null;
  const k = reading();
  const picked = new Set(opts.svc ? [opts.svc] : []);
  const dl = dueList(), dueNames = new Set(dl.filter(d => d.status !== "ok").map(d => d.s.name));
  const chips = [...new Set([...dl.filter(d => d.status !== "ok").map(d => d.s.name), "Engine oil and filter", "Tire rotation", ...S.sched.map(s => s.name)])];
  const src = row ? row.src : (lsGet("tm_lastsrc") || "Owner notes");
  const mine = /owner/i.test(src);
  const svcVal = row ? row.svc : [...picked].map(svcLabel).join(", ");
  // relevant info: prefill notes with the part numbers for what's being logged
  let notes = row ? row.notes : "";
  if (!row && opts.svc) { const s = S.sched.find(x => x.name === opts.svc); const pn = s ? partsFor(s).filter(p => /\d{5}|0W|75W|DOT|ATF|SLLC|DEXRON|FK20/i.test(p[1] || "")).map(p => `${p[0]}: ${p[1]}`) : []; if (pn.length) notes = "Parts: " + pn.join("; "); }
  const odoVal = row ? (row.odo != null && !row.oApprox ? mi(row.odo) : row.odoText) : (k ? mi(k.odo) : "");
  openSheet(`<div class="shead"><button type="button" class="hbtn" data-close>Cancel</button><b>${row ? "Edit entry" : "Log service"}</b><button type="submit" form="logForm" class="hbtn primary">${row ? "Save" : "Add"}</button></div>
    <form id="logForm" autocomplete="off" data-edit="${row ? row.r : ""}">
      ${row ? "" : `<div class="field"><span>Tap what you did</span><div class="svcchips">${chips.map(n => `<button type="button" data-pick="${esc(svcLabel(n))}" data-svcname="${esc(n)}" class="${picked.has(n) ? "on" : ""} ${dueNames.has(n) ? "due" : ""}">${esc(svcLabel(n))}</button>`).join("")}</div></div>`}
      <label class="field"><span>Service performed</span><input id="fSvc" value="${esc(svcVal)}" placeholder="Oil change, tire rotation…" required></label>
      <label class="field"><span>Odometer</span><input class="money-in" id="fOdo" inputmode="numeric" value="${esc(odoVal)}" placeholder="e.g. 54,210" ${row ? "" : "required"}></label>
      <label class="field"><span>Date</span><input id="fDate" type="date" value="${row && row.serial != null && !row.dApprox ? serialToIso(row.serial) : serialToIso(todaySerial())}" required></label>
      <div class="field"><span>Who did it</span><div class="seg-sm" id="srcSeg"><button type="button" data-src="me" class="${mine ? "on" : ""}">Did it myself</button><button type="button" data-src="shop" class="${mine ? "" : "on"}">Shop / dealer</button></div>
        <input id="fShop" class="shopin" placeholder="Shop name" value="${esc(mine ? "" : src)}" ${mine ? "hidden" : ""}></div>
      <label class="field"><span>Notes</span><textarea id="fNotes" placeholder="Parts used, cost, Trip A reset…">${esc(notes)}</textarea></label>
      <p class="hint">${row ? `Updates row ${row.r} on History.` : "Adds a row at the bottom of History. If the odometer is higher than the current reading, the main screen mileage updates too."}</p>
    </form>`);
}
function exportSheet(){
  const fmt = S.exFmt || "csv", rows = filteredHist().slice().reverse();   // oldest first, like the sheet
  const csvq = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const dateOut = r => r.serial != null && !r.dApprox ? serialToUS(r.serial) : r.dateText;
  const odoOut = r => r.odo != null && !r.oApprox ? String(Math.round(r.odo)) : r.odoText;
  const text = fmt === "csv"
    ? ["Date,Odometer,Service performed,Notes,Source", ...rows.map(r => [dateOut(r), odoOut(r), r.svc, r.notes, r.src].map(csvq).join(","))].join("\n")
    : [`Tacoma maintenance history${S.hfilter !== "all" ? " — " + FILTERS.find(f => f[0] === S.hfilter)[1] : ""}`, `Exported ${longDate(todaySerial())}`, "",
       ...rows.map(r => `${dateOut(r)} · ${r.odo != null && !r.oApprox ? mi(r.odo) + " mi" : r.odoText} · ${r.svc}${r.src ? " (" + r.src.replace(/\s*\(.*\)\s*/, "") + ")" : ""}${r.notes ? "\n    " + r.notes.replace(/\n+/g, " ") : ""}`)].join("\n");
  S.exText = text;
  openSheet(`<div class="shead"><button type="button" class="hbtn" data-close>Close</button><b>Export history</b><button type="button" class="hbtn primary" id="btnCopyEx">Copy</button></div>
    <div class="seg-sm"><button type="button" data-exfmt="csv" class="${fmt === "csv" ? "on" : ""}">CSV (spreadsheet)</button><button type="button" data-exfmt="text" class="${fmt === "text" ? "on" : ""}">Plain text</button></div>
    <p class="hint">${rows.length} entr${rows.length === 1 ? "y" : "ies"}${S.hfilter !== "all" ? ` · filter: ${esc(FILTERS.find(f => f[0] === S.hfilter)[1])}` : ""}. Copy it, then paste into Notes, Mail or Files — or use “Download from Google Sheets” for a file.</p>
    <textarea class="exbox" readonly>${esc(text)}</textarea>
    <div class="btns"><a class="btn linkbtn2" href="https://docs.google.com/spreadsheets/d/${esc(S.id)}/export?format=${fmt === "csv" ? "csv" : "pdf"}&gid=${esc(S.histGid ?? "")}" target="_blank" rel="noopener">Download from Google Sheets</a><button type="button" class="btn primary" id="btnCopyEx2">Copy ${fmt === "csv" ? "CSV" : "text"}</button></div>`);
}
function settingsSheet(){
  openSheet(`<h2>Settings</h2>
    <form id="setForm" autocomplete="off">
      <label class="field"><span>Apps Script web app link</span><input id="fApi" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <label class="field"><span>Key</span><input id="fKey" type="password" value="${esc(CFG.key)}" placeholder="The KEY from your Apps Script" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <label class="field"><span>Google Sheet (link or ID)</span><input id="fId" value="${esc(S.id)}"></label>
      <p class="hint">Uses the History and Recommended Maintenance Schedule tabs. The main-screen mileage is saved on History (cells H9:I10) so it's the same on your iPhone and iPad. Your “Log Tacoma Service” Shortcut keeps working. Link and key stay on this device only.</p>
      <p class="hint"><a href="https://docs.google.com/spreadsheets/d/${esc(S.id)}/edit" target="_blank" rel="noopener">Open the sheet in Google Sheets</a>${S.garage ? ` · <a href="${esc(S.garage)}" target="_blank" rel="noopener">Toyota Garage login</a>` : ""}</p>
      <button type="button" class="btn" id="btnRefresh" style="width:100%;margin-top:6px">Refresh from sheet now</button>
      <p class="hint">It also refreshes on its own every minute, and when you come back to the app.</p>
      <div class="btns"><button type="button" class="btn" data-close>Close</button><button class="btn primary" type="submit">Save</button></div>
    </form>`);
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e) {}
  try { const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch(e) { return false; }
}

/* ---------- events ---------- */
function saveOdo(n){
  const logged = Math.max(0, ...S.hist.filter(r => r.odo != null && !r.oApprox).map(r => r.odo));
  if (!n) { toast("Enter the odometer reading"); return false; }
  if (n < logged) { toast(`That's lower than the ${mi(logged)} already in History`, 3500); return false; }
  if (n > logged + 100000) { toast("That looks too high — check the number", 3500); return false; }
  const T = todaySerial();
  lsSet("tm_odo", JSON.stringify({odo:n, serial:T}));              // shows right away, even offline
  submitOp({type:"odo", odo:n, date:T}, "Saving mileage", `Mileage set to ${mi(n)}`);
  return true;
}
document.addEventListener("click", async e => {
  const t = e.target.closest("button, #scrim"); if (!t) return;
  if (t.id === "scrim" || t.hasAttribute("data-close")) return closeSheet();
  if (t.id === "fab") return ready() && logSheet();
  if (t.id === "btnRefresh") { closeSheet(); if (!S.busy && !S.loading && mcp) loadAll(); return; }
  if (t.id === "btnSettings" || t.id === "btnSettings2") return settingsSheet();
  if (t.id === "retry") return loadAll();
  if (t.id === "btnSteps") { S.svcTab = "how"; const oil = S.sched.find(s => /oil and filter/i.test(s.name)); return oil && svcSheet(oil.name, "how"); }
  if (t.id === "btnHero") { lsSet("tm_hero", heroOpen() ? "0" : "1"); return renderHero(); }
  if (t.id === "btnSync") return flushQueue(true);
  if (t.id === "btnExport") return exportSheet();
  if (t.dataset.exfmt) { S.exFmt = t.dataset.exfmt; return exportSheet(); }
  if (t.id === "btnCopyEx" || t.id === "btnCopyEx2") { toast(await copyText(S.exText || "") ? "Copied — paste it anywhere" : "Couldn't copy — select the text and copy", 3000); return; }
  if (t.id === "btnCopyList") {
    const s = S.sched.find(x => x.name === S.svcOpen); if (!s) return;
    const g = guideFor(s.name), txt = `${s.name}\n\nParts:\n${partsFor(s).map(p => `- ${p[0]}${p[1] ? ": " + p[1] : ""}`).join("\n")}\n\nTools:\n${(g ? g.tools : []).map(x => "- " + x).join("\n")}`;
    toast(await copyText(txt) ? "List copied" : "Couldn't copy", 2500); return;
  }
  if (t.dataset.jump) { S.view = "status"; render(); const el = $("#sec-" + t.dataset.jump); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if (t.dataset.qdel) {
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Discard"; setTimeout(() => { t.classList.remove("armed"); t.textContent = "✕"; }, 3000); return; }
    S.queue = S.queue.filter(q => q.qid !== t.dataset.qdel); return saveQueue();
  }
  if (t.dataset.tab) { closeSheet(); S.view = t.dataset.tab; render(); window.scrollTo({top:0, behavior:"smooth"}); return; }
  if (t.dataset.hf) { S.hfilter = t.dataset.hf; return renderView(); }
  if (t.dataset.svctab) return svcSheet(S.svcOpen, t.dataset.svctab);
  if (t.dataset.svc) { S.svcTab = "how"; return svcSheet(t.dataset.svc, "how"); }
  if (t.dataset.hrow) return histSheet(+t.dataset.hrow);
  if (t.dataset.logsvc) return logSheet({svc: t.dataset.logsvc});
  if (t.dataset.edit) return logSheet({edit: +t.dataset.edit});
  if (t.dataset.del) {
    if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Tap again to remove"; setTimeout(() => { if (t.isConnected) { t.classList.remove("armed"); t.textContent = "Remove"; } }, 3500); return; }
    const row = S.hist.find(x => x.r === +t.dataset.del); if (!row) return;
    return submitOp({type:"delete", r:row.r, origSvc:row.svc, origDate:row.serial}, "Removing", "Removed from History");
  }
  if (t.dataset.pick) {
    t.classList.toggle("on");
    const on = [...document.querySelectorAll("[data-pick].on")].map(b => b.dataset.pick);
    const all = new Set([...document.querySelectorAll("[data-pick]")].map(b => norm(b.dataset.pick)));
    const inp = $("#fSvc"); const typed = inp.value.split(/,\s*/).filter(x => x.trim() && !all.has(norm(x)));
    inp.value = [...on, ...typed].map((x, i) => i === 0 ? x : x.toLowerCase().replace(/^pcv/, "PCV").replace(/^maf/, "MAF")).join(", ");
    return;
  }
  if (t.dataset.src) {
    document.querySelectorAll("#srcSeg button").forEach(b => b.classList.toggle("on", b === t));
    const shop = $("#fShop"); shop.hidden = t.dataset.src === "me"; if (!shop.hidden) shop.focus(); return;
  }
  if (t.dataset.step != null) {
    const key = "tm_chk_" + norm(S.svcOpen), done = new Set(lsJSON(key, [])), i = +t.dataset.step;
    done.has(i) ? done.delete(i) : done.add(i); lsSet(key, JSON.stringify([...done]));
    t.classList.toggle("done", done.has(i)); const pr = $("#stepProg"); if (pr) pr.textContent = `${done.size} of ${document.querySelectorAll("[data-step]").length}`; return;
  }
  if (t.id === "btnStepsReset") { lsSet("tm_chk_" + norm(S.svcOpen), "[]"); return svcSheet(S.svcOpen, "how"); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "odoForm") {
    const inp = $("#heroOdo"), n = parseNum(inp.value);
    if (saveOdo(n)) { inp.value = ""; inp.blur(); render(); }
    return;
  }
  if (f.id === "setForm") {
    let v = $("#fId").value.trim(); const m = v.match(/\/d\/([\w-]{20,})/); if (m) v = m[1];
    const url = $("#fApi").value.trim(), key = $("#fKey").value.trim();
    const changed = url !== CFG.url || key !== CFG.key || (v && v !== S.id);
    CFG.url = url; CFG.key = key; lsSet("tm_api", url); lsSet("tm_key", key);
    if (v && v !== S.id) { S.id = v; lsSet("tm_sheet", v); S.hist = []; S.sched = []; }
    closeSheet();
    if (url && key) { const first = !mcp; mcp = {}; if (first) startLive(); if (changed) loadAll().then(() => { if (!S.err) toast("Connected"); }); }
    else { mcp = null; render(); }
    return;
  }
  if (f.id === "logForm") {
    const svc = $("#fSvc").value.trim(); if (!svc) return toast("Say what was done");
    const odoT = $("#fOdo").value.trim(), odo = parseNum(odoT);
    const editing = +f.dataset.edit || 0;
    if (!editing && !odo) return toast("Enter the odometer reading");
    const date = $("#fDate").value ? isoToSerial($("#fDate").value) : todaySerial();
    const me = $("#srcSeg .on").dataset.src === "me";
    const src = me ? "Owner notes" : ($("#fShop").value.trim() || "Shop");
    lsSet("tm_lastsrc", me ? "Owner notes" : src);
    const notes = $("#fNotes").value.trim();
    if (editing) {
      const row = S.hist.find(x => x.r === editing); if (!row) return;
      const keepOdo = odo == null || (row.oApprox && odoT === row.odoText);
      const keepDate = row.dApprox && $("#fDate").value === serialToIso(row.serial ?? todaySerial());
      const op = {type:"edit", r:row.r, origSvc:row.svc, origDate:row.serial, svc, odo: keepOdo ? row.odoText : odo, date, notes, src};
      if (keepDate) { op.date = null; op.dateText = row.dateText; }
      return submitOp(op, "Saving", "Updated");
    }
    const k = reading();
    if (k && odo < k.odo - 20000) return toast("That odometer looks too low — check it", 3500);
    return submitOp({type:"log", svc, odo, date, notes, src}, "Logging", "Logged to History");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#sheet").hidden) { closeSheet(); return; }
  const ae = document.activeElement, typing = ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
  if (!typing && $("#sheet").hidden && (e.key === "n" || e.key === "N")) { e.preventDefault(); if (ready()) logSheet(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !$("#sheet").hidden) { const f = $("#sheet form"); if (f) f.requestSubmit(); }
});
document.addEventListener("click", e => { if (e.target.closest("h1")) window.scrollTo({top:0, behavior:"smooth"}); });

/* ---------- boot ---------- */
$("#btnSettings").innerHTML = ICON.gear; $("#fab").innerHTML = ICON.plus;
loadCache(); render();
let live = false;
function startLive(){
  if (live) return; live = true;
  const quiet = () => mcp && !S.busy && !S.loading && $("#sheet").hidden && document.visibilityState === "visible" && navigator.onLine;
  setInterval(() => { if (!quiet()) return; if (S.queue.length) flushQueue(); else loadAll(); }, 60000);
  document.addEventListener("visibilitychange", () => { if (quiet() && (!S.loadedAt || Date.now() - S.loadedAt > 20000)) { S.queue.length ? flushQueue() : loadAll(); } });
  window.addEventListener("online", () => { S.offline = false; renderQueue(); setTimeout(() => { flushQueue(); if (!S.queue.length) loadAll(); }, 1500); });
  window.addEventListener("offline", () => { S.offline = true; render(); });
}
(async () => {
  mcp = CFG.url && CFG.key ? {} : null;     // "connected" = this device has the Apps Script link and key
  if (!mcp) { S.loading = false; render(); return; }
  startLive();
  await loadAll();
  flushQueue();
})();
// offline support: keep the app itself saved on the device
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).then(reg => {
    reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && navigator.onLine) reg.update().catch(() => {}); });
  }).catch(() => {}));
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;
    reloaded = true;
    if ($("#sheet").hidden) { toast("Updating to the newest version…", 0); setTimeout(() => location.reload(), 600); }
    else toast("A new version is ready — it loads next time you open the app", 4000);
  });
}
</script>
</body>
</html>
